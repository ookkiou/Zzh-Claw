[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zzhclaw"
dynamic = ["version"]
description = "运行在终端里的 AI 编码助手：工具调用、会话分支，CLI / TUI / Web 三种界面"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ookkiou" }]
keywords = ["ai", "agent", "cli", "tui", "coding-assistant", "llm", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.0,<16.0",
    "textual>=0.50,<9.0",
    "prompt_toolkit>=3.0,<4.0",
    "ddgs>=9.0,<10.0",
    "requests>=2.30,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "websockets>=14.0,<18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
zzhclaw = "zzhclaw.__main__:main"

[project.urls]
Homepage = "https://github.com/ookkiou/Zzh-Claw"
Issues = "https://github.com/ookkiou/Zzh-Claw/issues"

[tool.hatch.version]
path = "zzhclaw/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["zzhclaw"]

[tool.hatch.build.targets.sdist]
include = ["zzhclaw", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# 让测试直接 import zzhclaw，无需 pip install -e
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: 需要真实网络（默认被 conftest 的网络护栏拦截）",
    "llm: 需要真实 API key 的冒烟测试，默认跳过，用 --run-llm 开启",
]
