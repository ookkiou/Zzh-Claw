<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZzhClaw - AI 编码助手</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏：会话列表 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🐾</span>
                    <span class="logo-text">ZzhClaw</span>
                </div>
                <button class="btn-icon" id="btn-collapse" title="折叠侧边栏">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </button>
            </div>

            <button class="btn-new-chat" id="btn-new-chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>新建对话</span>
            </button>

            <div class="session-list" id="session-list">
                <!-- 动态填充 -->
            </div>

            <div class="sidebar-footer">
                <button class="btn-icon" id="btn-theme" title="切换主题">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
                <div class="model-info" id="model-info">gpt-4o-mini</div>
            </div>
        </aside>

        <!-- 主聊天区 -->
        <main class="main-area">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <button class="btn-icon btn-menu" id="btn-menu" title="展开侧边栏">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                <div class="chat-title" id="chat-title">新对话</div>
                <div class="top-actions">
                    <button class="btn-permission" id="btn-permission" title="点击切换权限模式：confirm(都问) → smart(只读自动) → auto(全自动)">
                        <span class="perm-icon" id="perm-icon">🔒</span>
                        <span class="perm-label" id="perm-label">confirm</span>
                    </button>
                    <button class="btn-icon" id="btn-save" title="保存会话">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                            <polyline points="17,21 17,13 7,13 7,21"/>
                            <polyline points="7,3 7,8 15,8"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- 消息区 -->
            <div class="messages-container" id="messages-container">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-logo">🐾</div>
                    <h1>我是 ZzhClaw</h1>
                    <p>你的 AI 编码助手，可以帮你读写文件、执行命令、联网搜索</p>
                    <div class="suggestion-cards">
                        <div class="suggestion-card" data-prompt="帮我看下当前目录有什么文件">
                            <span class="card-icon">📁</span>
                            <span>查看当前目录文件</span>
                        </div>
                        <div class="suggestion-card" data-prompt="写一个 Python 函数计算斐波那契数列">
                            <span class="card-icon">✨</span>
                            <span>写一个斐波那契函数</span>
                        </div>
                        <div class="suggestion-card" data-prompt="搜索一下 FastAPI 的最新特性">
                            <span class="card-icon">🔍</span>
                            <span>搜索 FastAPI 最新特性</span>
                        </div>
                        <div class="suggestion-card" data-prompt="解释一下这段代码的作用">
                            <span class="card-icon">💡</span>
                            <span>解释代码作用</span>
                        </div>
                    </div>
                </div>
                <div class="messages-list" id="messages-list">
                    <!-- 动态填充消息 -->
                </div>
            </div>

            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        id="user-input"
                        placeholder="给 ZzhClaw 发送消息... (Shift+Enter 换行)"
                        rows="1"
                    ></textarea>
                    <button class="btn-send" id="btn-send" title="发送 (Enter)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-hint">
                    ZzhClaw 可能会犯错，请核查重要信息。
                </div>
            </div>
        </main>
    </div>

    <!-- 工具确认弹窗 -->
    <div class="modal-overlay" id="confirm-modal" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-icon">⚠️</span>
                <h3>工具执行确认</h3>
            </div>
            <div class="modal-body">
                <p class="modal-desc">AI 请求执行以下工具：</p>
                <div class="tool-info">
                    <div class="tool-name" id="confirm-tool-name">run_bash</div>
                    <pre class="tool-args" id="confirm-tool-args">{}</pre>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" id="btn-confirm-no">取消</button>
                <button class="btn btn-approve" id="btn-confirm-yes">允许执行</button>
            </div>
        </div>
    </div>

    <!-- 连接状态提示 -->
    <div class="toast" id="toast" style="display: none;"></div>

    <script src="/static/app.js"></script>
</body>
</html>
